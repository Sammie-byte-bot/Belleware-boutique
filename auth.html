<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bellewear Boutique | Auth</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f8fafc;
      }
      .form-container {
        max-width: 400px;
        margin: 5vh auto;
        background: white;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      .input-field {
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        width: 100%;
        outline: none;
        transition: border 0.2s;
      }
      .input-field:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
      }
      .password-group {
        position: relative;
      }
      .eye-icon {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
      }
      .checkbox-container input {
        accent-color: #6366f1;
      }
      .submit-btn {
        background: #6366f1;
        color: white;
        width: 100%;
        padding: 0.5rem;
        border-radius: 0.5rem;
        transition: background 0.2s;
      }
      .submit-btn:hover {
        background: #4f46e5;
      }
      .social-btn {
        border: 1px solid #d1d5db;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.5rem;
        border-radius: 0.5rem;
        transition: background 0.2s;
      }
      .social-btn:hover {
        background: #f3f4f6;
      }
      #authMessage {
        text-align: center;
        color: red;
        font-size: 0.9rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h1 class="text-2xl font-bold text-center mb-6" id="formTitle">
        Create an account
      </h1>

      <form id="authForm" class="space-y-4" autocomplete="off" novalidate>
        <input
          type="text"
          id="first-name"
          name="firstName"
          placeholder="First name"
          class="input-field"
          required
        />
        <input
          type="text"
          id="last-name"
          name="lastName"
          placeholder="Last name"
          class="input-field"
          required
        />
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email"
          class="input-field"
          required
        />
        <div class="password-group">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            class="input-field"
            required
          />
          <span class="eye-icon" id="togglePassword">🙈</span>
        </div>
        <label class="flex items-center gap-2 text-sm">
          <input
            type="checkbox"
            id="terms-checkbox"
            name="terms"
            class="checkbox-container"
            required
          />
          I agree to the Terms & Conditions
        </label>
        <button type="submit" class="submit-btn" id="submitBtn">
          Create account
        </button>
        <div id="authMessage"></div>
      </form>

      <div class="or-separator text-center py-2">Or Continue with</div>

      <button type="button" class="social-btn google" id="googleSignInBtn">
        <svg
          viewBox="0 0 48 48"
          width="20px"
          height="20px"
          style="margin-right: 8px"
        >
          <g>
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.27 5.48-4.78 7.18l7.73 6c4.51-4.18 7.11-10.5 7.11-18.66z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
            <path fill="none" d="M0 0h48v48H0z" />
          </g>
        </svg>
        Google
      </button>

      <p class="login-prompt mt-4 text-center">
        Already have an account?
        <a href="#" class="text-indigo-600 font-medium" id="switchMode"
          >Log in</a
        >
      </p>
    </div>

    <script type="module" src="main.js"></script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
